name: ${COMPOSE_PROJECT_NAME:-voicelinkvr}

services:
  voicelink-light:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${VOICELINK_IMAGE:-boyqiu0010/voice-link-vr-server:latest}
    container_name: ${VOICELINK_LIGHT_CONTAINER_NAME:-voicelink-light}
    restart: unless-stopped
    ports:
      - "${VOICELINK_LIGHT_HOST_PORT:-18980}:8980"
    volumes:
      - ${VOICELINK_DATA_VOLUME:-voice-link-vr-server-local}:/usr/src/app/data:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      VOICELINK_RUNTIME_MODE: light
      VOICELINK_RUN_SCHEDULER: ${LIGHT_RUN_SCHEDULER:-true}
      VOICELINK_RUN_SCHEMA_UPGRADE: ${LIGHT_RUN_SCHEMA_UPGRADE:-true}
      UVICORN_WORKERS: ${LIGHT_UVICORN_WORKERS:-4}
      ADMIN_STATS_CACHE_TTL_SECONDS: ${ADMIN_STATS_CACHE_TTL_SECONDS:-45}
      CLIENT_DISCONNECT_CHECK_TIMEOUT_SECONDS: ${CLIENT_DISCONNECT_CHECK_TIMEOUT_SECONDS:-0.05}

  voicelink-heavy:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${VOICELINK_IMAGE:-boyqiu0010/voice-link-vr-server:latest}
    container_name: ${VOICELINK_HEAVY_CONTAINER_NAME:-voicelink-heavy}
    restart: unless-stopped
    ports:
      - "${VOICELINK_HEAVY_HOST_PORT:-18981}:8980"
    volumes:
      - ${VOICELINK_DATA_VOLUME:-voice-link-vr-server-local}:/usr/src/app/data:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      VOICELINK_RUNTIME_MODE: heavy
      VOICELINK_RUN_SCHEDULER: "false"
      VOICELINK_RUN_SCHEMA_UPGRADE: "false"
      UVICORN_WORKERS: ${HEAVY_UVICORN_WORKERS:-2}
      CLIENT_DISCONNECT_CHECK_TIMEOUT_SECONDS: ${CLIENT_DISCONNECT_CHECK_TIMEOUT_SECONDS:-0.05}
      ASR_QUEUE_LIMIT_ENABLED: ${ASR_QUEUE_LIMIT_ENABLED:-true}
      ASR_BACKEND_STATUS_ENABLED: ${ASR_BACKEND_STATUS_ENABLED:-false}
      ASR_QUEUE_WHISPER_MAX_CONCURRENCY: ${ASR_QUEUE_WHISPER_MAX_CONCURRENCY:-4}
      ASR_QUEUE_WHISPER_MAX_WAITING: ${ASR_QUEUE_WHISPER_MAX_WAITING:-4}
      ASR_QUEUE_WHISPER_TIMEOUT_SECONDS: ${ASR_QUEUE_WHISPER_TIMEOUT_SECONDS:-1.5}
      ASR_QUEUE_WHISPER_RETRY_AFTER_SECONDS: ${ASR_QUEUE_WHISPER_RETRY_AFTER_SECONDS:-2}
      ASR_QUEUE_FIRERED_MAX_CONCURRENCY: ${ASR_QUEUE_FIRERED_MAX_CONCURRENCY:-4}
      ASR_QUEUE_FIRERED_MAX_WAITING: ${ASR_QUEUE_FIRERED_MAX_WAITING:-4}
      ASR_QUEUE_FIRERED_TIMEOUT_SECONDS: ${ASR_QUEUE_FIRERED_TIMEOUT_SECONDS:-1.5}
      ASR_QUEUE_FIRERED_RETRY_AFTER_SECONDS: ${ASR_QUEUE_FIRERED_RETRY_AFTER_SECONDS:-2}
      ASR_CANCEL_CHECK_INTERVAL_SECONDS: ${ASR_CANCEL_CHECK_INTERVAL_SECONDS:-0.25}
      ASR_HARD_TIMEOUT_GRACE_SECONDS: ${ASR_HARD_TIMEOUT_GRACE_SECONDS:-10}
      ASR_ENDPOINT_CIRCUIT_BREAKER_ENABLED: ${ASR_ENDPOINT_CIRCUIT_BREAKER_ENABLED:-true}
      ASR_ENDPOINT_CIRCUIT_WINDOW_SECONDS: ${ASR_ENDPOINT_CIRCUIT_WINDOW_SECONDS:-60}
      ASR_ENDPOINT_CIRCUIT_CONSECUTIVE_TIMEOUTS: ${ASR_ENDPOINT_CIRCUIT_CONSECUTIVE_TIMEOUTS:-2}
      ASR_ENDPOINT_CIRCUIT_CONSECUTIVE_FAILURES: ${ASR_ENDPOINT_CIRCUIT_CONSECUTIVE_FAILURES:-3}
      ASR_ENDPOINT_CIRCUIT_TIMEOUT_RATE: ${ASR_ENDPOINT_CIRCUIT_TIMEOUT_RATE:-0.2}
      ASR_ENDPOINT_CIRCUIT_MIN_SAMPLES: ${ASR_ENDPOINT_CIRCUIT_MIN_SAMPLES:-5}
      ASR_ENDPOINT_CIRCUIT_OPEN_SECONDS: ${ASR_ENDPOINT_CIRCUIT_OPEN_SECONDS:-15}
      ASR_ENDPOINT_CIRCUIT_RETRY_AFTER_SECONDS: ${ASR_ENDPOINT_CIRCUIT_RETRY_AFTER_SECONDS:-2}

volumes:
  voice-link-vr-server-local:
    name: ${VOICELINK_DATA_VOLUME:-voice-link-vr-server-local}
